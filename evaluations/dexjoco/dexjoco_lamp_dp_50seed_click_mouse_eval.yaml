# Shared protocol is inherited; only task and artifact settings belong here.
# Hydra searchpath must be declared in the primary config.
defaults:
- dexjoco_lamp_dp_eval_50_base
- override /env@env.eval: dexjoco_click_mouse
- _self_
hydra:
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
runner:
  logger:
    log_path: ./outputs/lamp_evaluations
    experiment_name: dexjoco_lamp_dp_50seed_click_mouse
rollout:
  model:
    model_path: ''
env:
  eval:
    click_mouse_warmup_steps: 30
