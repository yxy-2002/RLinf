# Shared protocol is inherited; only task and artifact settings belong here.
# Hydra searchpath must be declared in the primary config.
defaults:
- dexjoco_lamp_dp_eval_50_base
- override /env@env.eval: dexjoco_hammer_nail
- _self_
hydra:
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
runner:
  logger:
    log_path: ./outputs/lamp_evaluations/hammer_nail
    experiment_name: dexjoco_lamp_dp_il_mlp_hammer_nail_eval_50
rollout:
  model:
    model_path: ./outputs/lamp_dp_rerun/dexjoco_lamp_dp_il_mlp_hammer_nail/artifact
