# Shared protocol is inherited; only task and artifact settings belong here.
# Hydra searchpath must be declared in the primary config.
defaults:
- dexjoco_lamp_dp_eval_50_base
- override /env@env.eval: dexjoco_pinch_tongs
- _self_
hydra:
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
runner:
  logger:
    log_path: ./outputs/lamp_evaluations/pinch_tongs
    experiment_name: dexjoco_lamp_dp_il_mlp_pinch_tongs_eval_50
rollout:
  model:
    model_path: ./outputs/lamp_dp_rerun/dexjoco_lamp_dp_il_mlp_pinch_tongs/artifact
