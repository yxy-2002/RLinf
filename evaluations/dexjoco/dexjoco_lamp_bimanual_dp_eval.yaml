defaults:
  - env/dexjoco_bimanual_assembly@env.eval
  - model/lamp_dp@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-0

runner:
  task_type: embodied_eval
  only_eval: true
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: dexjoco_lamp_bimanual_dp_eval
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: lamp_il
  adv_type: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 4
    total_num_envs: 4
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  enable_torch_compile: true
  torch_compile_mode: max-autotune-no-cudagraphs
  model:
    action_dim: 46
    model_path: ../results/dexjoco_lamp_dp/artifact
    use_temporal_ensemble: false
    execution_horizon_override: 8

reward:
  use_reward_model: false

critic:
  use_critic_model: false
