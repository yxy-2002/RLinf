# Shared evaluation protocol from the group A/B main experiment.
# 904 rollout steps cover the 900-step episode limit in complete 8-step chunks.
defaults:
- env@env.eval: dexjoco_pick_bucket
- model/lamp_dp@rollout.model
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-0
runner:
  task_type: embodied_eval
  only_eval: true
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: dexjoco_lamp_dp_eval_50
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
algorithm:
  loss_type: lamp_il
  adv_type: null
env:
  group_name: EnvGroup
  eval:
    seed: 0
    rollout_epoch: 1
    total_num_envs: 50
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 904
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    lamp_history_contract: primitive_v1
    lamp_history_length: 8
rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  enable_torch_compile: false
  torch_compile_mode: max-autotune-no-cudagraphs
  model:
    model_path: ../results/dexjoco_lamp_dp/artifact
    is_lora: false
    num_action_chunks: 8
    use_temporal_ensemble: false
    execution_horizon_override: 8
    eval_base_noise_seed: 42
    eval_base_noise_seeds: []
    eval_base_noise_seed_offset: 0
reward:
  use_reward_model: false
critic:
  use_critic_model: false
