defaults:
  - dexjoco_lamp_dp_eval
  - _self_

runner:
  logger:
    experiment_name: dexjoco_lamp_dp_eval_50

env:
  eval:
    # With group_size=1, the 50 environments receive seeds 20260803--20260852.
    seed: 20260803
    rollout_epoch: 1
    total_num_envs: 50
    group_size: 1
    auto_reset: false
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
