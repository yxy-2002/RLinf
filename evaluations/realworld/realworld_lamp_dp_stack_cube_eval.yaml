# One physical-robot evaluation rollout; reuse the demonstrated task setup.
defaults:
  - wuji_demo_data_stack_cube
  - model/lamp_dp@rollout.model
  - robot/wuji_lamp@rollout.model.robot_spec
  - _self_

hydra:
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  component_placement:
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: reward_gpu
      placement: 0

runner:
  task_type: embodied_eval
  only_eval: true
  success_source: null
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  logger:
    log_path: ./logs/eval/wuji_lamp
    experiment_name: realworld_lamp_dp_stack_cube_eval

algorithm:
  loss_type: lamp_il
  adv_type: null

env:
  eval:
    total_num_envs: 1
    group_size: 1
    rollout_epoch: 20
    max_steps_per_rollout_epoch: 400
    max_episode_steps: 400
    auto_reset: false
    is_eval: true
    override_cfg:
      use_reward_model: false
      reward_success_confirmation: false
      enable_pose_reward: false
    lamp_adapter: rlinf.envs.lamp_realworld_adapter:RealWorldLampAdapter
    lamp_robot_spec: ${rollout.model.robot_spec}
    lamp_history_length: 8
    glove_config:
      release_behavior: policy
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  enable_torch_compile: false
  recompute_logprobs: false
  collect_transitions: false
  collect_prev_infos: false
  model:
    model_path: /workspace/yxy_RLinf/RLinf/logs/realworld_stack_cubes/realworld_lamp_dp_mlp_stack_cube/artifact
    action_dim: 26
    num_action_chunks: 8
    use_temporal_ensemble: false
    execution_horizon_override: 8

critic:
  use_critic_model: false

# Execute the policy without loading a reward checkpoint or judging success.
reward:
  use_reward_model: false
  standalone_realworld: false
  model:
    model_path: null
