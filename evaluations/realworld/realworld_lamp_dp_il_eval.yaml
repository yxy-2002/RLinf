# Shared DP evaluation settings; compose after the task/device configuration.
defaults:
  - model/lamp_dp@rollout.model
  - robot/wuji_lamp@rollout.model.robot_spec
  - _self_

cluster:
  component_placement:
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: reward_gpu
      placement: 0

runner:
  task_type: embodied_eval
  only_eval: true
  # First Enter resets; second Enter starts policy execution, including round 1.
  pause_between_eval_episodes: true
  success_source: reward_model
  max_epochs: 1
  max_steps: -1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  loss_type: lamp_il
  adv_type: null

env:
  eval:
    total_num_envs: 1
    group_size: 1
    rollout_epoch: 20
    max_steps_per_rollout_epoch: 400
    max_episode_steps: 400
    auto_reset: false
    is_eval: true
    override_cfg:
      use_reward_model: true
      reward_success_confirmation: true
      enable_pose_reward: false
    lamp_adapter: rlinf.envs.lamp_realworld_adapter:RealWorldLampAdapter
    lamp_robot_spec: ${rollout.model.robot_spec}
    lamp_history_length: 8
    glove_config:
      release_behavior: policy
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  enable_torch_compile: false
  recompute_logprobs: false
  collect_transitions: false
  collect_prev_infos: false
  model:
    action_dim: 26
    num_action_chunks: 8
    use_temporal_ensemble: false
    execution_horizon_override: 8

critic:
  use_critic_model: false

# The environment uses the standalone reward service to confirm success.
reward:
  use_reward_model: true
  standalone_realworld: true
