defaults:
- dexhand_reward_training
- _self_

# NUC hosts Ray; offline reward training runs only on GPU node rank 1.
cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: reward_gpu
      placement: 0
  node_groups:
  - label: controller
    node_ranks: 0
    ignore_hardware: true
    env_configs:
    - node_ranks: 0
      env_vars:
      - RLINF_COMM_NET_DEVICES: enp3s0
      - GLOO_SOCKET_IFNAME: enp3s0
      - NCCL_SOCKET_IFNAME: enp3s0
  - label: reward_gpu
    node_ranks: 1
    env_configs:
    - node_ranks: 1
      python_interpreter_path: /opt/venv/openvla/bin/python
      env_vars:
      - RLINF_COMM_NET_DEVICES: enp5s0
      - GLOO_SOCKET_IFNAME: enp5s0
      - NCCL_SOCKET_IFNAME: enp5s0

runner:
  logger:
    experiment_name: ruiyan-pipette-resnet18

# Reviewed data, episode split with val_split=0.1 and seed=0.
# Use processed_data, not the unreviewed train.pt/val.pt in its parent.
data:
  train_data_paths: /workspace/yxy_RLinf/RLinf/logs/reward_data/20261105-123933-ruiyan_reward_data_pipette/processed_data/train.pt
  val_data_paths: /workspace/yxy_RLinf/RLinf/logs/reward_data/20261105-123933-ruiyan_reward_data_pipette/processed_data/val.pt
