defaults:
  - wuji_reward_data
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

runner:
  task_type: embodied
  logger:
    log_path: ./logs
    project_name: rlinf
    experiment_name: wuji-reward-data-stack-cube
  num_success_frames: 200
  val_split: 0.2
  random_seed: 42
