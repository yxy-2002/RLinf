defaults:
  - /env/realworld_dex_pnp@env.eval
  - /env/dexhand/wuji
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: wuji-reward-data
    logger_backends: [tensorboard]
  label_source: spacemouse_right
  camera_keys: [wrist_1, global]
  num_success_frames: 200
  val_split: 0.1
  random_seed: 42
  fps: 10 # Image/label capture and arm step frequency; hand teleop is independent.
# [ 0.59875072  0.04150214  0.44313849  1.82560534 -0.77090803  1.26209335]
env:
  eval:
    max_episode_steps: 10000 # Keep same as env.eval.override_cfg.max_num_steps
    preserve_env_truncations: true
    auto_reset: false
    ignore_terminations: false
    keyboard_reward_wrapper: null
    right_button_labels_only: true
    hand_teleop_frequency: 60 # Maximum target submission rate; fresh targets depend on solver speed.
    override_cfg:
      camera_fps: 30 # Camera capture rate, independent of the 10 FPS recording rate.
      enable_pose_reward: false
      use_reward_model: false
      max_num_steps: 10000 # Keep same as env.eval.max_episode_steps
    data_collection:
      enabled: false
