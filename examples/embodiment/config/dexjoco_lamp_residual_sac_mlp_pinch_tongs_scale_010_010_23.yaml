# Requires a single-arm version-2 lamplstm DP deployment artifact.
defaults:
  - env/dexjoco_pinch_tongs@env.train
  - env/dexjoco_pinch_tongs@env.eval
  - dexjoco_lamp_residual_sac
  - _self_
cluster:
  component_placement:
    actor: 2-2
    env: 2-3
    rollout: 2-3
runner:
  logger:
    experiment_name: dexjoco_lamp_residual_sac_lamplstm_mlp_pinch_tongs_scale_010_010
actor:
  model:
    model_path: /vepfs-mlp2/c20250301/240906020/RLinf/outputs/lamp_lstm_il/group_b/runs/pinch_tongs/mlp/dp/run/artifact
    hand_prior:
      type: mlp
    wrist_residual_scale: 0.1
    hand_residual_scale: 0.1
env:
  train:
    lamp_history_length: 8
  eval:
    lamp_history_length: 8
