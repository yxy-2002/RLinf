# Training hyperparameters aligned with dexjoco_lamp_prior_pca.
defaults:
- realworld_lamp_il
- _self_
algorithm:
  stage: prior
data:
  dataset_root: ./logs/20261006-082710-wuji_demo_data_stack_cube/demos
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  image_size: 128
runner:
  max_steps: 1
  local_update_steps: 1
  save_interval: 1
  logger:
    experiment_name: realworld_lamp_prior_pca_stack_cube
    logger_backends:
    - tensorboard
  max_epochs: 1000000
  log_interval: 100
  val_check_interval: -1
actor:
  model:
    hand_prior:
      type: pca
      hand_side: single
      latent_dim: 2
      history_length: 8
      artifact_path: null
    execution_horizon: 4
    num_action_chunks: 4
  seed: 42
  global_batch_size: 128
  micro_batch_size: 128
  eval_batch_size: 256
  torch_compile: false
  compile_mode: default
  validation_interval: 500
  validation_batches: -1
  optim:
    lr: 0.0001
    min_lr: 1.0e-06
    warmup_steps: 500
    weight_decay: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    backbone_lr_ratio: 0.1
