# @package _global_
# vq prior: hyperparameters from the group A/B main experiment.
defaults:
- /dexjoco_lamp_paper/dexjoco_lamp_paper_base
- _self_
actor:
  micro_batch_size: 256
  global_batch_size: 256
  eval_batch_size: 512
  validation_interval: -1
  optim:
    lr: 0.0003
    min_lr: 0.0
    warmup_steps: 150
    weight_decay: 1.0e-06
    adam_beta1: 0.95
    clip_grad: null
  model:
    num_action_chunks: 4
    execution_horizon: 4
    hand_prior:
      type: vq
      latent_dim: 1
      hidden_dim: 512
      action_dim: 16
      code_latent_dim: 256
      num_quantizers: 2
      codebook_size: 4
      layer_num: 5
      commitment_weight: 1.0
      ema_decay: 0.8
      epsilon: 1.0e-05
      dead_code_threshold: 0.0
      reconstruction_multiplier: 3.0
      vq_multiplier: 5.0
  validate_at_end: true
runner:
  max_epochs: 1500
  max_steps: 30000
  local_update_steps: 100
  save_interval: 10000
  save_every_epochs: 10
algorithm:
  stage: prior
