# @package _global_
# Shared settings frozen from group_a/group_b; select a task config to train.
defaults:
- override /hydra/job_logging: stdout
- _self_
actor:
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  seed: 42
  torch_compile: false
  compile_mode: default
  validation_batches: -1
  optim:
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    backbone_lr_ratio: 0.1
  model:
    model_type: lamp_dp
    resnet_path: ./pretrained_models/resnet-18
    hand_prior:
      hand_side: single
      artifact_path: null
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
runner:
  task_type: offline
  only_eval: false
  logger:
    log_path: ./outputs/lamp_paper
    project_name: rlinf
    experiment_name: ???
    logger_backends:
    - tensorboard
  val_check_interval: -1
  log_interval: 100
  resume_dir: null
  export_only: false
algorithm:
  loss_type: lamp_il
  adv_type: null
  gamma: 0.99
data:
  dataset_type: dexjoco_lamp
  task_name: ???
  dataset_root: ./datasets/DexJoCo-Datasets-LeRobot/dexjoco_lerobot_datasets
  cache_root: ./outputs/lamp_paper/cache
  cache_path: null
  image_size: 128
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  history_contract: primitive_v1
rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1
  model:
    model_type: lamp_dp
    model_path: ''
    precision: '32'
env:
  group_name: EnvGroup
reward:
  use_reward_model: false
critic:
  use_critic_model: false
hydra:
  run:
    dir: .
  output_subdir: null
