defaults:
- env/realworld_dex_pnp@env.train
- env/realworld_dex_pnp@env.eval
- model/cnn_policy@actor.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: '4090'
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: '4090'
      placement: 0
    reward:
      node_group: '4090'
      placement: 0
  node_groups:
  - label: '4090'
    node_ranks: 1
  - label: franka
    node_ranks: 0
    hardware:
      type: Franka
      configs:
      - robot_ip: 172.17.0.2
        node_rank: 0
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: franka_ruiyan_rlpd
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null
algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  enable_drq: false
  backup_entropy: false
  critic_subsample_size: 2
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -6
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  critic_actor_ratio: 4
  replay_buffer:
    enable_cache: true
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: false
  demo_buffer:
    enable_cache: true
    cache_size: 200
    min_buffer_size: 1
    sample_window_size: 200
    load_path: /workspace/RLinf/datasets/demos_20260924_103922
    auto_save: false
  target_update_freq: 1
env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    no_gripper: false
    use_spacemouse: true
    retargeting:
      type: channel_linear
    glove_config:
      type: psiglove_1
      left_port: /dev/ttyACM0
      frequency: 60
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 600
    preserve_env_truncations: true
    right_button_labels_only: true
    override_cfg:
