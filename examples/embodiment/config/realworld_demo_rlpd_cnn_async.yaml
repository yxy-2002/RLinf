    auto_reset: true
    max_episode_steps: 600
    preserve_env_truncations: true
    right_button_labels_only: true
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /workspace/RLinf/RLinf-ResNet10-pretrained
    precision: ${actor.model.precision}
    action_dim: 12
    num_q_heads: 10
  enable_torch_compile: false
  enable_cuda_graph: false
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: false
  model:
    model_path: /workspace/RLinf/RLinf-ResNet10-pretrained
    state_dim: 24
    action_dim: 12
    num_q_heads: 10
  optim:
    clip_grad: 10.0
    lr: 0.0003
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 0.0003
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: true
  group_name: RewardGroup
  standalone_realworld: true
  reward_mode: per_step
  reward_threshold: 0.95
  reward_weight: 1.0
  env_reward_weight: 0.0
  model:
    model_path: /workspace/RLinf/logs/20260924-094123-dexhand_reward_training/dexhand-reward-training/checkpoints/best_model/actor/model_state_dict/full_weights.pt
    model_type: resnet
    pretrained: false
    arch: resnet18
    hidden_dim: 256
    dropout: 0.1
    image_size:
    - 3
    - 224
    - 224
    normalize: true
    precision: fp32
    camera_keys:
    - wrist_1
    - global
critic:
  use_critic_model: false
weight_syncer:
  nccl_max_ctas: 32
