defaults:
  - model/lamp_residual_sac@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: 0-3
    rollout: 0-3

runner:
  task_type: embodied
  execution_mode: async
  enable_decoupled_mode: false
  weight_sync_interval: 1
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: dexjoco_lamp_residual_sac_v4
    logger_backends: [tensorboard, wandb]
    step_axis: env_step
  max_steps: 16000
  only_eval: false
  val_check_interval: 200
  save_interval: 1000
  resume_dir: null
  ckpt_path: null

algorithm:
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  update_epoch: 1
  group_size: 1

  # Policy Decorator online SAC: no demos, two Qs, min-Q target and actor.
  demo_fraction: 0.0
  agg_q: min
  actor_agg_q: min
  backup_entropy: true
  bootstrap_type: standard
  gamma: 0.97
  tau: 0.01
  target_update_freq: 1
  target_update_type: all
  critic_actor_ratio: 1

  # V4 collects 32 * (16 / 8) = 64 macro transitions and grants 16 updates.
  utd_ratio: 0.25
  learning_starts_macro_transitions: 8000
  progressive_exploration_macro_steps: 30000
  async:
    max_pending_collector_rounds: 1
    lockstep_updates: true

  entropy_tuning:
    alpha_type: exp
    initial_alpha: 0.01
    # Inferred from the artifact's decoder-causal coordinates.
    target_entropy: null
    optim:
      lr: 1.0e-4
      lr_scheduler: torch_constant
      clip_grad: 50.0

  replay_buffer:
    enable_cache: true
    cache_size: 70000
    sample_window_size: 70000
    min_buffer_size: 1
    auto_save: true
    enable_preload: true
    prefetch_size: 4

env:
  group_name: EnvGroup
  train:
    observation_image_size: 128
    rollout_epoch: 1
    total_num_envs: 32
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 16
  eval:
    observation_image_size: 128
    seed: 0
    rollout_epoch: 4
    total_num_envs: 48
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 904
    is_eval: true
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  collect_transitions: true
  collect_prev_infos: false
  enable_torch_compile: false
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  seed: 1234
  global_batch_size: 1024
  micro_batch_size: 1024
  enable_offload: false
  enable_drq: false
  sync_weight_no_wait: false
  model:
    model_path: ""
  optim:
    lr: 1.0e-4
    lr_scheduler: torch_constant
    clip_grad: 50.0
  critic_optim:
    lr: 1.0e-4
    lr_scheduler: torch_constant
    clip_grad: 50.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
