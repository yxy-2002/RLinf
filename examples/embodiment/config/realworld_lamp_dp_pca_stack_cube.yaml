# Training hyperparameters aligned with dexjoco_lamp_dp_il_pca_water_plant.
defaults:
- realworld_lamp_dp_pca
- _self_
data:
  dataset_root: ./logs/20261006-082710-wuji_demo_data_stack_cube/demos
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  image_size: 128
runner:
  max_steps: 30000
  save_interval: 10000
  logger:
    experiment_name: realworld_lamp_dp_pca_stack_cube
    logger_backends:
    - tensorboard
  max_epochs: 1000000
  local_update_steps: 100
  log_interval: 100
  val_check_interval: -1
actor:
  optim:
    lr: 0.0001
    min_lr: 1.0e-06
    warmup_steps: 1000
    weight_decay: 0.001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    backbone_lr_ratio: 0.03
  model:
    resnet_path: ./pretrained_models/resnet-18
    hand_prior:
      type: pca
      hand_side: single
      latent_dim: 2
      history_length: 8
      artifact_path: ./outputs/realworld_lamp_prior_pca_stack_cube/artifact
    execution_horizon: 4
    num_action_chunks: 4
  seed: 42
  global_batch_size: 512
  micro_batch_size: 512
  eval_batch_size: 512
  torch_compile: true
  compile_mode: default
  validation_interval: 500
  validation_batches: -1
