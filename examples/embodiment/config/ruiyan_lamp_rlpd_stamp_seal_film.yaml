# Ruiyan setup and native RLPD settings inherit realworld_lamp_rlpd_base.
defaults:
- ruiyan_lamp_rlpd
- env/dexhand/ruiyan_stamp_seal
- _self_

runner:
  resume_dir: null
  logger:
    experiment_name: ruiyan_lamp_rlpd_stamp_seal_50demo_film_015_010

env:
  eval:
    glove_config:
      left_button_mode: toggle

actor:
  model:
    model_path: /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_four_models_20261102/film_baseline/dp/actor/artifact
    wrist_residual_scale: 0.15
    hand_residual_scale: 0.1
    actor_input: condition
    critic_observation_input: condition
    hand_prior:
      type: lamplstm

algorithm:
  demo_buffer:
    clamp_negative_hand_states: true
    load_path:
    - /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_state_noise_20261102/20261102-112724-ruiyan_demo_data_stamp_seal_limited/demos
    - /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_state_noise_20261102/20261102-113816-ruiyan_demo_data_stamp_seal_limited/demos
    - /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_state_noise_20261102/20261102-115413-ruiyan_demo_data_stamp_seal_limited/demos
    - /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_state_noise_20261102/20261102-121031-ruiyan_demo_data_stamp_seal_limited/demos
    - /workspace/yxy_RLinf/RLinf/outputs/stamp_new50_state_noise_20261102/20261102-122526-ruiyan_demo_data_stamp_seal_limited/demos

reward:
  model:
    model_path: /workspace/yxy_RLinf/RLinf/logs/reward_model/20261030-140506-ruiyan_reward_training_stamp_seal/ruiyan-stamp-seal-resnet18/checkpoints/global_step_400/actor/model_state_dict/full_weights.pt
