# Requires a single-arm version-2 lamplstm DP deployment artifact.
defaults:
  - env/dexjoco_fold_glasses@env.train
  - env/dexjoco_fold_glasses@env.eval
  - dexjoco_lamp_residual_sac
  - _self_
cluster:
  component_placement:
    actor: 2-2
    env: 2-3
    rollout: 2-3
runner:
  logger:
    experiment_name: dexjoco_lamp_residual_sac_lamplstm_fold_glasses_scale_025_025
actor:
  model:
    model_path: /vepfs-mlp2/c20250301/240906020/RLinf/outputs/lamp_lstm_il/group_a/runs/fold_glasses/lstm_film/dp/run/artifact
    hand_prior:
      type: lamplstm
    wrist_residual_scale: 0.25
    hand_residual_scale: 0.25
env:
  train:
    lamp_history_length: 8
  eval:
    lamp_history_length: 8
