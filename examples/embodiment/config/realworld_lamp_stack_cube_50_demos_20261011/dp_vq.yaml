# Selected DP group: backbone_ratio_1; fixed prior recipe: prior_beta_1e4.
# Dataset split: 45 training / 5 validation trajectories, split_seed=42.
# Exact snapshot, including original GPU, cache, artifact and output paths.
# For a new run, override runner.logger.log_path to a new output directory.
# The original sweep used cached_train_entry.py in the source sweep directory
# to consume data.cache_path directly and preserve the frozen split.
# examples/embodiment/train_lamp_il.py instead prepares/reselects its cache.
# Selection used offline first-8 MSE, not real-world task success.

