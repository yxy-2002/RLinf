# Requires a single-arm version-2 lamplstm DP deployment artifact.
defaults:
  - env/dexjoco_water_plant@env.train
  - env/dexjoco_water_plant@env.eval
  - dexjoco_lamp_residual_sac
  - _self_
cluster:
  component_placement:
    actor: 4-4
    env: 4-5
    rollout: 4-5
runner:
  logger:
    experiment_name: dexjoco_lamp_residual_sac_pca_water_plant_scale_040_040
actor:
  model:
    model_path: /vepfs-mlp2/c20250301/240906020/RLinf/outputs/lamp_lstm_il/group_b/runs/water_plant/pca/dp/run/artifact
    hand_prior:
      type: pca
    wrist_residual_scale: 0.40
    hand_residual_scale: 0.40
env:
  train:
    lamp_history_length: 8
  eval:
    lamp_history_length: 8
