defaults:
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
runner:
  task_type: embodied
  success_source: reward_model
  logger:
    log_path: ./outputs
    project_name: rlinf_realworld
    logger_backends:
    - tensorboard
    - wandb
    experiment_name: realworld_lamp_rlpd
    step_axis: collector_step
  execution_mode: async
  enable_decoupled_mode: false
  weight_sync_interval: 25
  max_steps: 16000
  only_eval: false
  val_check_interval: -1
  save_interval: 500
  resume_dir: null
  ckpt_path: null
algorithm:
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  update_epoch: 8
  group_size: 1
  demo_fraction: 0.5
  agg_q: min
  actor_agg_q: mean
  backup_entropy: false
  bootstrap_type: standard
  gamma: 0.97
  tau: 0.01
  target_update_freq: 1
  target_update_type: all
  critic_actor_ratio: 4
  entropy_tuning:
    alpha_type: exp
    initial_alpha: 0.01
    # Inferred as -0.5 * the number of decoder-causal coordinates.
    target_entropy: null
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 50.0
  replay_buffer:
    enable_cache: true
    cache_size: 70000
    sample_window_size: 70000
    min_buffer_size: 100
    auto_save: true
    enable_preload: false
    prefetch_size: 4
  demo_buffer:
    enable_cache: true
    cache_size: 1000
    sample_window_size: 1000
    min_buffer_size: 1
    auto_save: true
    load_path: ???
  training_recipe: realworld_rlpd
rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 0
    top_p: 1.0
    max_new_tokens: 1
  group_name: RolloutGroup
  backend: huggingface
  pipeline_stage_num: 1
  enable_offload: false
  collect_transitions: true
  collect_prev_infos: false
  enable_torch_compile: true
  # Validated on the realworld DP artifact; no automatic CUDA Graph capture.
  torch_compile_mode: default
  enable_cuda_graph: false
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  model:
    model_type: lamp_residual_sac
    model_path: ""
    precision: "32"
    is_lora: false
    contract_version: 5
    residual_application: corrected_plan_crop
    base_use_temporal_ensemble: false
    actor_input: pre_fusion
    critic_observation_input: pre_fusion
    entropy_scope: decoder_causal
    action_dim: 26
    action_horizon: 16
    num_action_chunks: 8
    num_q_heads: 2
    residual_scale: 0.05
    wrist_residual_scale: 0.05
    hand_residual_scale: 0.05
    actor_hidden_dims: [256, 256, 256]
    log_std_min: -20.0
    log_std_max: 2.0
    init_log_std: -9.0
    eval_base_noise_seed: ${env.eval.seed}
    eval_base_noise_seeds: []
    eval_base_noise_seed_offset: 0
    target_entropy: ${algorithm.entropy_tuning.target_entropy}
    hand_prior: null
    training_recipe: ${algorithm.training_recipe}
  group_name: ActorGroup
  training_backend: fsdp
  # Compile actor/Q network kernels; sampling and log-prob autograd stay eager.
  compile_model: true
  seed: 1234
  global_batch_size: 256
  micro_batch_size: 256
  enable_offload: false
  enable_drq: false
  sync_weight_no_wait: false
  optim:
    lr: 0.0003
    lr_scheduler: torch_constant
    clip_grad: 50.0
  critic_optim:
    lr: 0.0003
    lr_scheduler: torch_constant
    clip_grad: 50.0
  fsdp_config:
    sharding_strategy: no_shard
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
critic:
  use_critic_model: false
reward:
  use_reward_model: true
  standalone_realworld: true
  group_name: RewardGroup
  reward_threshold: 0.95
  model:
    model_type: resnet
    model_path: ???
    camera_keys:
    - wrist_1
    - global
    pretrained: false
    arch: resnet18
    hidden_dim: 256
    dropout: 0.1
    image_size:
    - 3
    - 224
    - 224
    normalize: true
    precision: fp32
hydra:
  run:
    dir: .
  output_subdir: null
env:
  group_name: EnvGroup
  eval:
    right_button_ends_episode: true
    observation_image_size: 128
    seed: 42
    rollout_epoch: 1
    total_num_envs: 1
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 900
    max_steps_per_rollout_epoch: 8
    is_eval: false
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    lamp_adapter: rlinf.envs.lamp_realworld_adapter:RealWorldLampAdapter
    lamp_continue_intervention: true
    lamp_robot_spec: ${actor.model.robot_spec}
    lamp_history_length: 16
    glove_config:
      release_behavior: policy
  train: ${env.eval}
