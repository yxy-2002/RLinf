# Ruiyan setup and native RLPD settings inherit realworld_lamp_rlpd_base.
defaults:
- ruiyan_lamp_rlpd
- _self_

runner:
  logger:
    experiment_name: ruiyan_lamp_rlpd_stack_cube_film_030_020

actor:
  model:
    # Load the exported DP and its embedded LAMPLSTM FiLM prior together.
    model_path: /workspace/yxy_RLinf/RLinf/outputs/ruiyan_stack_cube_20demo_film_20261022/delivery/film/artifact
    wrist_residual_scale: 0.3
    hand_residual_scale: 0.2
    hand_prior:
      type: lamplstm

# Load all 30 recorded demos directly; chunk/history adaptation runs at startup.
algorithm:
