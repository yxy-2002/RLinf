# Inherit the FiLM recipe; override only variant/stage-specific settings.
defaults:
- realworld_lamp_prior_lamplstm_film_stack_cube
- _self_
actor:
  model:
    hand_prior:
      type: vq
      latent_dim: 1
      code_latent_dim: 256
      hidden_dim: 512
      num_quantizers: 2
      codebook_size: 4
      layer_num: 5
      commitment_weight: 1.0
      ema_decay: 0.8
      epsilon: 1.0e-05
      dead_code_threshold: 0.0
      reconstruction_multiplier: 3.0
      vq_multiplier: 5.0
runner:
  logger:
    experiment_name: realworld_lamp_prior_vq_stack_cube
