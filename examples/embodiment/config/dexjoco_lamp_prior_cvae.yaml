defaults:
  - dexjoco_lamp_il_base
  - _self_

runner:
  max_steps: 20000
  save_interval: 5000
  logger:
    experiment_name: dexjoco_lamp_prior_cvae

data:
  dataset_root: ./datasets/DexJoCo-Datasets-LeRobot/dexjoco_lerobot_datasets

actor:
  global_batch_size: 256
  micro_batch_size: 256
  eval_batch_size: 512
  torch_compile: false
  validation_interval: 20000
  validation_batches: -1
  optim:
    lr: 3.0e-4
    min_lr: 1.0e-5
    warmup_steps: 500
    weight_decay: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 1.0
  model:
    hand_prior:
      type: cvae
      latent_dim: 3
      hidden_dim: 1024
      posterior_kl_weight: 1.0e-4
      prior_kl_weight: 1.0e-3
      kl_warmup_steps: 2000
