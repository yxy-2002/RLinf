# Water plant FiLM baseline with fixed boundary loss weight 0.2, set by user.
# Paused: this configuration has not been launched. Earlier weight=0.021 logs
# remain in boundary_loss_water_plant_20261008/{mse,delta_mse}.
actor:
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  seed: 42
  micro_batch_size: 512
  global_batch_size: 512
  eval_batch_size: 512
  torch_compile: false
  compile_mode: default
  validation_interval: 1000
  validation_batches: -1
  optim:
    lr: 5.0e-05
    min_lr: 1.0e-06
    warmup_steps: 500
    weight_decay: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    backbone_lr_ratio: 0.1
  model:
    model_type: lamp_dp
    num_action_chunks: 8
    resnet_path: /vepfs-mlp2/c20250301/240906020/RLinf/pretrained_models/resnet-18
    execution_horizon: 8
    hand_prior:
      type: lamplstm
      hand_side: single
      latent_dim: 2
      hidden_dim: 512
      beta: 0.0005
      beta_warmup_steps: 0
      posterior_kl_weight: 0.0001
      prior_kl_weight: 0.001
      kl_warmup_steps: 2000
      artifact_path: null
      right:
        artifact_path: null
        latent_dim: 3
      left:
        artifact_path: null
        latent_dim: 3
      action_dim: 16
      history_dim: 16
      history_length: 8
      horizon: 16
      action_hidden_dim: 256
      condition_hidden_dim: 256
      encoder_condition_mode: film
      decoder_condition_mode: film
      num_lstm_layers: 1
      condition_drop_prob: 0.1
      boundary_loss_type: mse
      boundary_loss_weight: 0.2
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
runner:
  task_type: offline
  only_eval: false
  logger:
    log_path: /vepfs-mlp2/c20250301/240906020/RLinf/outputs/lamp_lstm_il/boundary_loss_water_plant_20261008/weight_0p2/mse
    project_name: rlinf
    experiment_name: run
    logger_backends:
    - tensorboard
  max_epochs: 1000000
  max_steps: 20000
  local_update_steps: 100
  val_check_interval: -1
  save_interval: 10000
  log_interval: 100
  resume_dir: null
  export_only: false
algorithm:
  stage: prior
  loss_type: lamp_il
  adv_type: null
  gamma: 0.99
data:
  dataset_type: dexjoco_lamp
  task_name: water_plant
  dataset_root: /c20250301/yangxinye/dexjoco/datasets/DexJoCo-Datasets-LeRobot/dexjoco_lerobot_datasets
  cache_root: /vepfs-mlp2/c20250301/240906020/RLinf/outputs/lamp_lstm_il/cache
  cache_path: null
  image_size: 128
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  history_contract: primitive_v1
  history_length: 8
  horizon: 16
  action_dim: 16
  source: dexjoco_lerobot
  train_ratio: 0.9
  split_seed: 42
rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1
  model:
    model_type: lamp_dp
    model_path: ''
    precision: '32'
env:
  group_name: EnvGroup
reward:
  use_reward_model: false
critic:
  use_critic_model: false
hydra:
  run:
    dir: .
  output_subdir: null
