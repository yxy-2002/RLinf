defaults:
- ruiyan_lamp_il
- _self_
runner:
  max_epochs: 1500
  max_steps: 30000
  save_every_epochs: 10
  logger:
    experiment_name: ruiyan_lamp_prior_vq_stack_cube
actor:
  seed: 233
  global_batch_size: 256
  micro_batch_size: 256
  eval_batch_size: 512
  validation_interval: -1
  validate_at_end: true
  validation_batches: -1
  optim:
    lr: 0.0003
    min_lr: 0.0
    warmup_steps: 150
    weight_decay: 1.0e-06
    adam_beta1: 0.95
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: null
  model:
    hand_prior:
      type: vq
      latent_dim: 1
      action_dim: 6
      code_latent_dim: 256
      hidden_dim: 512
      num_quantizers: 2
      codebook_size: 4
      layer_num: 5
      commitment_weight: 1.0
      ema_decay: 0.8
      epsilon: 1.0e-05
      dead_code_threshold: 0.0
      reconstruction_multiplier: 3.0
      vq_multiplier: 5.0
