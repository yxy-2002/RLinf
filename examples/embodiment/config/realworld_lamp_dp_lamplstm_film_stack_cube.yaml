# Inherit the FiLM recipe; override only variant/stage-specific settings.
defaults:
- realworld_lamp_prior_lamplstm_film_stack_cube
- _self_
algorithm:
  stage: dp
runner:
  max_steps: 40000
  logger:
    experiment_name: realworld_lamp_dp_lamplstm_film_stack_cube
actor:
  optim:
    lr: 6.0e-05
    warmup_steps: 1000
    weight_decay: 0.0001
  model:
    hand_prior:
      artifact_path: ./outputs/realworld_lamp_prior_lamplstm_film_stack_cube/artifact
