name: Dexhand core tests
on:
  pull_request:
    paths:
      - 'third_party/rlinf-dexhand/**'
      - 'rlinf/envs/dexhand/**'
      - 'toolkits/dexhand/**'
      - 'tests/dexhand/**'
      - 'examples/embodiment/collect_hand_data.py'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: bash requirements/install.sh dexhand test
      - run: PYTHONPATH=. python -m pytest -q third_party/rlinf-dexhand/tests tests/dexhand
