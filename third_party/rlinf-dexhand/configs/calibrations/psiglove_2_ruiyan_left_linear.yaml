# Slots side/back name the legacy OUTPUT roles, not selected PSI2 sensors.
# Selected sensor ADC endpoints come from mapping_file.
# Measured thumb poses span the full output range; four-finger clipping is unchanged.
left_glove:
  calibration:
    thumb:
      rotate:
        calibration:
          min: 3400
          max: 3350
        clip:
          source:
            min: 0.7
            max: 1.0
          target:
            min: 0.0
            max: 1.0
